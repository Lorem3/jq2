# This workflow publishes the package to npm using Trusted Publishing (OIDC),
# so no long-lived NPM_TOKEN is required.
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [created]
  push:
    branches: [ "master","main" ]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # npm >= 11.5.1 才会自动走 OIDC 可信发布
      - run: npm install -g npm@latest
      - run: npm publish
